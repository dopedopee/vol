name: OI 기록 수집

on:
  schedule:
    - cron: '17 2,14 * * *'   # 하루 두 번 (한국시간 11:17 · 23:17). 바이낸스 일별 파일은 다음 날 올라옴
  workflow_dispatch:           # Actions 탭에서 'Run workflow'로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: collect-oi
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: OI 수집
        run: python scripts/collect_oi.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/oi
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: OI 기록 갱신 $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
